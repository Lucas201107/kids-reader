# 英语绘本跟读系统 · Nginx 配置
# 部署位置：/etc/nginx/sites-available/kids-reader
# 启用：sudo ln -s /etc/nginx/sites-available/kids-reader /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#
# 需要修改的地方：
#   1. api.example.com      → 你的域名（共 3 处）
#   2. ssl 证书路径          → 实际证书位置
#   3. /opt/kids-reader/server/uploads/ → 实际上传目录

upstream kids_reader {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/ssl/api.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/api.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 录音上传：小程序录音最长 60s，mp3 约 500KB，留足余量
    client_max_body_size 20m;
    client_body_timeout  60s;

    access_log /var/log/nginx/kids-reader.access.log;
    error_log  /var/log/nginx/kids-reader.error.log;

    gzip on;
    gzip_min_length 1k;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # 音频 / 图片由 Nginx 直接提供，不经过 Node（同时也让腾讯云 SOE 能取到音频 URL）
    location /static/ {
        alias /opt/kids-reader/server/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass         http://kids_reader;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 发音评测是同步调用，超时给足
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
