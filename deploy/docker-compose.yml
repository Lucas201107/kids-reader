# Docker 部署（可选，裸机 pm2 方案见 deploy/deploy.sh）
#
# 用法：
#   1. cp deploy/.env.production.example server/.env 并填写真实配置
#   2. cd deploy && docker compose up -d --build
#   3. 首次导入种子数据：
#      docker compose exec api npx ts-node seeds/seed.ts
#      （或先 npm run seed 再构建；容器内已带 ts-node 依赖）
#   4. 看日志：docker compose logs -f api
#
# 注意：数据库与上传文件都在命名卷里，删容器不会丢数据；
#       但执行 docker compose down -v 会删除卷，请先备份。

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kids-reader-api:latest
    container_name: kids-reader-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # 只监听本机，对外由 Nginx 反向代理
    env_file:
      - ../server/.env
    environment:
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      # 容器内数据库路径（对应下方 data 卷）
      DATABASE_URL: file:/app/prisma/prod.db
    volumes:
      - kids-data:/app/prisma
      - kids-uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/content/words',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kids-data:
  kids-uploads:
